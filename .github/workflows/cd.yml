name: CD

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC token exchange
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # TODO (Phase 7): Remove the `if: false` once AWS resources are provisioned
    if: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

